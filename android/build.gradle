def isNewArchitectureEnabled() {
    // Set by the app's gradle.properties, and always "true" from React Native 0.82
    return project.findProperty('newArchEnabled')?.toString() == 'true'
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "dev.mediacache.apngavif"
    compileSdkVersion safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += isNewArchitectureEnabled() ? 'src/newarch/java' : 'src/oldarch/java'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Version supplied by the app's React Native Gradle plugin.
    implementation "com.facebook.react:react-android"
    implementation "androidx.appcompat:appcompat:1.7.0"
    // 3.0.5 pulls org.aomedia.avif.android:avif 1.1.1, the first build with 16 KB-aligned .so
    // files; 3.0.1 pulled 1.0.1, which Google Play rejects for apps targeting Android 15+.
    implementation "com.github.penfeizhou.android.animation:apng:3.0.5"
    implementation "com.github.penfeizhou.android.animation:avif:3.0.5"
}
